<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Three large circles representing major cities on the left, and a scattered field of many small circles representing small towns on the right, with both sides shown as equal in total area">
  <rect width="480" height="300" fill="#15171A"/>
  <g stroke="#2A2D31" stroke-width="1">
    <line x1="0" y1="72" x2="480" y2="72"/>
    <line x1="0" y1="150" x2="480" y2="150"/>
    <line x1="0" y1="228" x2="480" y2="228"/>
  </g>

  <!-- left: the three cities everybody builds for -->
  <g fill="#6FA3D8">
    <circle cx="70" cy="112" r="27"/>
    <circle cx="128" cy="168" r="22"/>
    <circle cx="62" cy="192" r="18"/>
  </g>
  <text x="24" y="252" fill="#A3AAB4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2">3 CITIES</text>
  <text x="24" y="270" fill="#3A3E44" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing=".8">EVERYONE COMPETES</text>

  <!-- divider -->
  <line x1="212" y1="58" x2="212" y2="242" stroke="#3A3E44" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="205" y="156" fill="#EAEBE6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15">=</text>

  <!-- right: the long tail, same total area, nobody competing -->
  <g fill="#6FA3D8" opacity=".92">
    <circle cx="252" cy="80" r="5"/><circle cx="281" cy="66" r="4"/><circle cx="309" cy="88" r="6"/>
    <circle cx="338" cy="70" r="4"/><circle cx="366" cy="92" r="5"/><circle cx="395" cy="74" r="4"/>
    <circle cx="424" cy="86" r="6"/><circle cx="451" cy="68" r="4"/>
    <circle cx="245" cy="112" r="4"/><circle cx="273" cy="128" r="6"/><circle cx="302" cy="110" r="4"/>
    <circle cx="330" cy="126" r="5"/><circle cx="359" cy="108" r="4"/><circle cx="388" cy="124" r="6"/>
    <circle cx="417" cy="112" r="4"/><circle cx="446" cy="128" r="5"/>
    <circle cx="256" cy="152" r="6"/><circle cx="285" cy="166" r="4"/><circle cx="314" cy="148" r="5"/>
    <circle cx="343" cy="164" r="4"/><circle cx="371" cy="150" r="6"/><circle cx="400" cy="166" r="4"/>
    <circle cx="429" cy="152" r="5"/><circle cx="456" cy="164" r="4"/>
    <circle cx="248" cy="192" r="5"/><circle cx="277" cy="204" r="4"/><circle cx="306" cy="188" r="6"/>
    <circle cx="335" cy="202" r="4"/><circle cx="363" cy="190" r="5"/><circle cx="392" cy="204" r="4"/>
    <circle cx="421" cy="188" r="6"/><circle cx="449" cy="202" r="4"/>
  </g>
  <text x="252" y="252" fill="#A3AAB4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2">258 TOWNS</text>
  <text x="252" y="270" fill="#3A3E44" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing=".8">NOBODY COMPETES</text>

  <text x="24" y="40" fill="#EAEBE6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="1">THE LONG TAIL ADDS UP</text>
</svg>
