<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cells: Cell and Molecule Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Six basic cells as illustrative 3D cutaways. Tap a part to see what it does.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b7469'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
:root {
  --stage-a: #eef3f1; --stage-b: #c9d6d2; --fog: #dfe8e5; --shadow3d-o: 0.32; --vignette: rgba(40, 70, 64, 0.16); --leader: #31443f; --glass: rgba(247, 250, 249, 0.86);
  --panel: #f7faf9; --raised: #ffffff;
  --ink: #13201e; --muted: #4c5e5b; --line: #7d8d8a;
  --accent: #0b7469; --accent-soft: rgba(11, 116, 105, 0.12); --on-accent: #ffffff;
  --shadow: 0 10px 30px rgba(17, 36, 33, 0.14);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage-a: #1c2826; --stage-b: #070b0a; --fog: #121a19; --shadow3d-o: 0.6; --vignette: rgba(0, 0, 0, 0.45); --leader: #b9ccc7; --glass: rgba(20, 30, 29, 0.84);
    --panel: #141e1d; --raised: #1b2826;
    --ink: #e4eeeb; --muted: #9db0ac; --line: #66807b;
    --accent: #39b9ab; --accent-soft: rgba(57, 185, 171, 0.16); --on-accent: #04201c;
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage-a: #1c2826; --stage-b: #070b0a; --fog: #121a19; --shadow3d-o: 0.6; --vignette: rgba(0, 0, 0, 0.45); --leader: #b9ccc7; --glass: rgba(20, 30, 29, 0.84);
  --panel: #141e1d; --raised: #1b2826;
  --ink: #e4eeeb; --muted: #9db0ac; --line: #66807b;
  --accent: #39b9ab; --accent-soft: rgba(57, 185, 171, 0.16); --on-accent: #04201c;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--panel); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; }
.skip:focus { top: calc(8px + var(--top)); }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.stagewrap { position: relative; flex: 0 0 46%; min-height: 250px; background: radial-gradient(85% 75% at 50% 42%, var(--stage-a) 0%, var(--stage-b) 100%); overflow: hidden; }
.stagewrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(140% 110% at 50% 42%, transparent 55%, var(--vignette) 100%); }
.panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; background: var(--panel); border-top: 1px solid var(--line); padding: 14px 16px calc(20px + var(--bottom)); -webkit-overflow-scrolling: touch; }
@media (min-width: 880px) {
  .app { flex-direction: row; }
  .stagewrap { flex: 1 1 auto; min-height: 0; }
  .panel { flex: 0 0 410px; border-top: 0; border-left: 1px solid var(--line); padding: 18px 22px 28px; }
}
.app.nogl .stagewrap { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; }
.app.nogl .badge { position: static; order: 2; margin: 0 16px 12px; box-shadow: none; }
@media (min-width: 880px) { .app.nogl .stagewrap { flex: 0 0 34%; } }

#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#viewport { position: absolute; inset: 0; outline: none; }
#viewport:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
#viewport.picky { cursor: pointer; }
.brand { position: absolute; left: 12px; top: calc(10px + var(--top)); z-index: 4; font-weight: 600; font-size: 15px; letter-spacing: -0.005em; padding: 4px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); max-width: calc(100% - 262px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { position: absolute; right: 10px; top: calc(10px + var(--top)); z-index: 6; display: flex; gap: 6px; }
.viewbtn { border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.viewbtn:hover { border-color: var(--accent); }
.viewbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.viewbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.motion { position: absolute; right: 10px; bottom: 10px; z-index: 6; font-size: 13px; min-height: 36px; padding: 6px 12px; }
.badge { position: absolute; left: 10px; bottom: 10px; z-index: 6; max-width: calc(100% - 150px); background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.leaders .lead { fill: none; stroke: var(--leader); stroke-width: 1.3; stroke-opacity: 0.85; }
.leaders .lead.sel { stroke: var(--accent); stroke-width: 2; stroke-opacity: 1; }
.leaders .ldot { fill: var(--panel); stroke: var(--leader); stroke-width: 2; }
.leaders .ldot.sel { stroke: var(--accent); stroke-width: 3; }
.callouts { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.co { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px; max-width: 168px; padding: 3px 10px 3px 7px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid var(--line); font-size: 13px; font-weight: 600; line-height: 1.2; color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,0.12); will-change: transform; transition: border-color .15s, background .15s; }
.co:hover { border-color: var(--accent); }
.co .cname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cdot { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
.co.sel { cursor: default; flex-wrap: wrap; max-width: min(250px, 62vw); padding: 8px 12px; border-radius: 14px; border: 2px solid var(--accent); font-size: 15px; box-shadow: var(--shadow); }
.co.sel .cname { white-space: normal; }
.co.sel .cdot { width: 12px; height: 12px; }
.chip { flex-basis: 100%; display: inline-flex; align-items: center; justify-content: center; min-height: 36px; margin-top: 6px; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; text-decoration: none; }
.chip::after { content: "\2192"; margin-left: 6px; }
.chip:hover { filter: brightness(1.08); }
.pin { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-data); font-size: 12px; font-weight: 700; color: var(--ink); background: var(--glass); border: 3px solid var(--sw); box-shadow: 0 2px 8px rgba(0,0,0,0.3); will-change: transform; }
.hovertip { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; padding: 3px 10px; border-radius: 8px; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 600; white-space: nowrap; }
.msg { position: relative; z-index: 6; padding: 52px 16px 16px; }
.msg { position: relative; z-index: 6; padding: 52px 16px 16px; }
.msg p { margin: 0; max-width: 52ch; }

.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.home { font-size: 14px; }
h1 { margin: 2px 0 4px; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; }
.intro { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.picker { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; padding: 0; }
.picker button { width: 100%; min-height: 44px; padding: 6px 4px; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); line-height: 1.15; display: flex; align-items: center; justify-content: center; gap: 6px; transition: border-color .15s, background .15s; }
.picker .ico { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
@media (max-width: 420px) { .picker .ico { width: 20px; height: 20px; } .picker button { gap: 4px; font-size: 13px; } }
.picker button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px var(--accent-soft); }
.picker button:hover { border-color: var(--accent); }
.summary { font-size: 17px; line-height: 1.5; margin: 0 0 12px; max-width: 48ch; }
sup.ref { font-family: var(--font-data); font-size: 11px; margin-left: 1px; }
sup.ref a { text-decoration: none; }
.card { border: 1px solid var(--line); background: var(--raised); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; }
.card h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 0 0 4px; font-size: 18px; }
.card p { margin: 0 0 6px; }
.small { font-size: 14px; color: var(--muted); }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.parts button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; font-size: 15px; }
.parts button:hover { border-color: var(--accent); }
.parts button[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); padding: 5px 9px; font-weight: 600; }
.parts .pname { flex: 1 1 auto; min-width: 0; }
.parts .num { display: none; flex: none; font-family: var(--font-data); font-size: 12px; color: var(--muted); min-width: 22px; text-align: right; }
.parts.numbered .num { display: inline; }
.sw { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.35); box-shadow: inset 0 -3px 5px rgba(0,0,0,0.18), inset 0 2px 3px rgba(255,255,255,0.35); }
.partcard { transition: border-color .2s, box-shadow .2s; }
.partcard.chosen { border: 2px solid var(--accent); padding: 11px 13px; box-shadow: var(--shadow); }
.partcard .ph { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
.partcard .ph h3 { margin: 0; }
.partcard .sw { width: 22px; height: 22px; }
.molbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
.molbtn::after { content: "\2192"; }
.molbtn:hover { filter: brightness(1.08); }
.stepper { align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.stepper .pos { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 500; font-size: 15px; }
.btn:hover { border-color: var(--accent); }
.mol { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
.sources { margin: 6px 0 0; padding-left: 20px; font-size: 13px; color: var(--muted); }
.sources li { margin: 0 0 4px; }
.sources a { overflow-wrap: anywhere; }
details.card > summary { cursor: pointer; font-weight: 600; font-size: 15px; min-height: 28px; }
details.card[open] > summary { margin-bottom: 8px; }
.foot { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.foot summary { cursor: pointer; min-height: 28px; }
#partCard:focus { outline: none; }
#partCard:focus-visible { outline: 3px solid var(--accent); }
</style>
</head>
<body>
<a class="skip" href="#panel" id="skip">Skip to the parts list</a>
<div class="app" id="app">
  <main class="stagewrap" id="stagewrap">
    <div id="viewport" tabindex="0" role="group" aria-label="3D cell view" aria-describedby="viewhelp alt">
      <canvas id="gl"></canvas>
    </div>
    <span id="viewhelp" class="sr-only"></span>
    <svg class="leaders" id="leaders" aria-hidden="true"></svg>
    <div class="callouts" id="callouts" aria-hidden="true"></div>
    <div class="hovertip" id="hovertip" hidden aria-hidden="true"></div>
    <div class="brand" id="brand">Cells</div>
    <div class="tools">
      <button class="viewbtn" id="labelsBtn" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="11" r="2"/><path d="M5.5 9.5 9 6h5"/></svg><span id="labelsTxt">Labels</span></button>
      <button class="viewbtn" id="resetView" type="button">Reset view</button>
    </div>
    <button class="viewbtn motion" id="motionBtn" type="button" aria-pressed="false">Pause motion</button>
    <div class="badge" id="badge">Illustrative, not to scale</div>
    <div class="msg" id="nogl" hidden role="status"><p id="noglTxt"></p></div>
  </main>
  <section class="panel" id="panel" aria-labelledby="cellTitle" tabindex="-1">
    <a class="home" id="home" href="../index.html">Explorer home</a>
    <p class="eyebrow" id="pageTitle">Cells</p>
    <p class="intro" id="intro"></p>
    <nav aria-label="Cells" id="pickerNav"><ul class="picker" id="picker"></ul></nav>
    <h1 id="cellTitle" tabindex="-1">Loading</h1>
    <p class="summary" id="summary"></p>
    <div class="card" id="linkCard" hidden><a class="mol" id="extraLink" href="../index.html"></a></div>
    <section class="card" aria-labelledby="partsHeading">
      <h2 id="partsHeading">Parts and colour key</h2>
      <p class="small" id="partsHint"></p>
      <ul class="parts" id="parts"></ul>
      <div class="row"><button class="btn" id="showAll" type="button" disabled>Show all parts</button></div>
    </section>
    <section class="card partcard" id="partCard" tabindex="-1" aria-live="polite" aria-labelledby="partTitle">
      <div class="ph"><span class="sw" id="partSw" aria-hidden="true" hidden></span><h3 id="partTitle"></h3></div>
      <div id="partText"><p class="small" id="partPrompt"></p></div>
      <p id="partMol" hidden><a class="molbtn" id="partMolLink" href="#"></a></p>
      <div class="row stepper"><button class="btn" id="prevPart" type="button">Previous part</button><span class="pos" id="stepPos" aria-hidden="true"></span><button class="btn" id="nextPart" type="button">Next part</button></div>
    </section>
    <details class="card" id="altCard">
      <summary id="altSummary">Text description of this view</summary>
      <p id="alt"></p>
    </details>
    <section class="card" aria-labelledby="srcHeading">
      <h2 id="srcHeading">Sources</h2>
      <ol class="sources" id="sourceList"></ol>
    </section>
    <details class="foot"><summary id="creditsSummary">Credits and licences</summary><div id="credits"></div></details>
  </section>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>
