<body>
<h1 class="sr-only">Hemoglobin breathing: the shape change between the T state and the R state</h1>
<main id="morph" aria-label="Hemoglobin breathing"></main>
<noscript><p>This page needs JavaScript to draw the hemoglobin model. In words: hemoglobin has four chains, two alpha and two beta, each holding a heme with one iron atom that can carry one oxygen. Without oxygen it sits in the T (tense) state. As oxygen binds, each iron settles into its heme ring and one alpha-beta pair turns about 15 degrees against the other, giving the R (relaxed) state, which holds oxygen more strongly.</p></noscript>
<script type="module">
import { mount } from './morph.js';
const q = new URLSearchParams(location.search);
const theme = q.get('theme');
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
const t = q.get('t');
mount(document.getElementById('morph'), {
  realHref: '../molecules/#hemoglobin',
  startView: q.get('view') || undefined,
  startT: t != null ? +t : undefined,
  autoplay: q.has('still') ? false : undefined,
});
</script>
<script type="module" src="../shell/shell.js" data-page="morph"></script>
