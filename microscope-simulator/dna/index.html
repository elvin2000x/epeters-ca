<body>
<h1 class="sr-only">DNA double helix, an illustrative model with real proportions</h1>
<main id="dna" aria-label="DNA double helix"></main>
<noscript><p>This page needs JavaScript to draw the DNA model. In words: DNA is two strands twisted into a right-handed double helix about 2 nm wide, with base pairs 0.34 nm apart and about 10.5 pairs per turn. A pairs with T through 2 hydrogen bonds, G pairs with C through 3, and the two strands run in opposite directions.</p></noscript>
<script type="module">
import { mount } from './dna.js';
const q = new URLSearchParams(location.search);
const theme = q.get('theme');
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
// no homeHref: the app shell's bar carries the way home
mount(document.getElementById('dna'), { realHref: '../molecules/#dna', startMode: q.get('mode') || undefined });
</script>
