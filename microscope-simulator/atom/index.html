<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atom Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Any of the 118 elements as a 3D atom: orbital clouds, Bohr shells and the nucleus.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b7469'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('cme-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="../app.css">
<style>
.atom-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.atom-tools h1 { margin: 0 auto 0 0; }
.atom-pick { display: flex; align-items: center; gap: 6px; }
.atom-pick select { font: inherit; font-size: 15px; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); color: var(--ink); max-width: 56vw; }
.atom-nav { min-width: 44px; }
#viewer { --atomv-aspect: auto; --atomv-height: min(72vh, 760px); }
@media (max-width: 600px) {
  #viewer { --atomv-height: min(92vw, 62vh); }
  .atom-tools h1 { flex-basis: 100%; font-size: 24px; }
  .atom-pick { flex: 1; }
  .atom-pick select { flex: 1; max-width: none; }
}
</style>
</head>
<body>
<a class="skip" href="#viewer" data-ui="page.title">Skip to the atom</a>
<header class="topbar">
  <a class="brand" href="../elements/"><span class="brand-name" data-ui="nav.back">Periodic table</span><span class="brand-sub" data-ui="page.sub">Look inside any of the 118 elements</span></a>
  <button class="icon-btn" id="theme" type="button" aria-pressed="false" data-ui="theme.toggle">Switch light or dark</button>
</header>
<main class="wrap">
  <div class="atom-tools">
    <h1 data-ui="page.title">Atom viewer</h1>
    <div class="atom-pick">
      <button class="icon-btn atom-nav" id="prev" type="button" data-ui-label="nav.prev" aria-label="Previous element">&#8592;</button>
      <label class="sr-only" for="pick" data-ui="picker.label">Element</label>
      <select id="pick"></select>
      <button class="icon-btn atom-nav" id="next" type="button" data-ui-label="nav.next" aria-label="Next element">&#8594;</button>
    </div>
  </div>
  <div id="viewer"></div>
</main>
<script type="module">
import { mount, loadData } from './atom.js';
import { bindTheme } from '../common.js';

bindTheme(document.getElementById('theme'));
const data = await loadData();
const ui = data.ui || {};
for (const n of document.querySelectorAll('[data-ui]')) if (ui[n.dataset.ui]) n.textContent = ui[n.dataset.ui];
for (const n of document.querySelectorAll('[data-ui-label]')) if (ui[n.dataset.uiLabel]) n.setAttribute('aria-label', ui[n.dataset.uiLabel]);

const pick = document.getElementById('pick');
for (const e of data.elements) pick.append(new Option(`${e.z}  ${e.symbol}  ${e.name}`, String(e.z)));

// #C or #26 picks the element; ?mode=bohr or ?mode=nucleus picks the view; ?fps=1 shows a frame counter (QA)
function fromHash() {
  const key = decodeURIComponent(location.hash.slice(1)).trim();
  if (!key) return 6;
  if (/^\d+$/.test(key)) return Math.min(118, Math.max(1, +key));
  const hit = data.elements.find((e) => e.symbol.toLowerCase() === key.toLowerCase());
  return hit ? hit.z : 6;
}
const params = new URLSearchParams(location.search);
let z = fromHash();
const viewer = mount(document.getElementById('viewer'), z, {
  mode: params.get('mode') || 'orbital', zoom: true, showFps: params.has('fps'),
  quality: params.get('quality') || 'auto',
  onChange: (s) => {
    z = s.z; pick.value = String(s.z);
    if (location.hash.slice(1) !== s.symbol) history.replaceState(null, '', `${location.pathname}${location.search}#${s.symbol}`);
    document.title = `${s.symbol}, ${data.elements[s.z - 1].name} | ${ui['page.title'] || 'Atom viewer'}`;
  },
});
window.__atom = viewer;
const go = (nz) => viewer.setElement(((nz - 1 + 118) % 118) + 1);
pick.addEventListener('change', () => go(+pick.value));
document.getElementById('prev').addEventListener('click', () => go(z - 1));
document.getElementById('next').addEventListener('click', () => go(z + 1));
addEventListener('hashchange', () => go(fromHash()));
addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.closest && t.closest('input, select, textarea, canvas')) return;
  if (e.key === '[' || e.key === 'PageUp') { e.preventDefault(); go(z - 1); }
  else if (e.key === ']' || e.key === 'PageDown') { e.preventDefault(); go(z + 1); }
});
</script>
<script type="module" src="../shell/shell.js" data-page="atom"></script>
</body>
</html>
