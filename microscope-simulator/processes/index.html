<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How life works: Cell and Molecule Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Interactive, step-by-step animations of DNA to protein, mitosis, cellular respiration, photosynthesis and an osmosis lab. Free for students and teachers.">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b7469'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('cme-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* no storage: follow the system theme */ }</script>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="processes.css">
</head>
<body>
<a class="skip" href="#steps" data-ui="skip">Skip to the steps</a>
<header class="topbar">
  <a class="brand" href="../index.html"><span class="brand-name" data-ui="page.title">How life works</span><span class="brand-sub" data-ui="page.eyebrow">Cell and Molecule Explorer</span></a>
  <nav class="topnav" aria-label="Site">
    <a class="navlink" id="allLink" href="./" data-ui="nav.all" hidden>All processes</a>
    <a class="navlink" href="../index.html" data-ui="nav.home">Explorer home</a>
  </nav>
  <button class="icon-btn" id="theme" type="button" aria-pressed="false" data-ui="theme.toggle">Switch light or dark</button>
</header>

<main id="main" tabindex="-1">
  <!-- Hub: the list of explainers -->
  <section class="hub" id="hub" hidden aria-labelledby="hubTitle">
    <div class="wrap">
      <p class="eyebrow" data-ui="page.eyebrow">Cell and Molecule Explorer</p>
      <h1 id="hubTitle" data-ui="page.title">How life works</h1>
      <p class="lede" data-ui="page.lede"></p>
      <p class="note" id="hubNote" role="status" hidden></p>
      <ul class="cards" id="cards" data-ui-label="hub.label"></ul>
    </div>
  </section>

  <!-- One explainer -->
  <section class="explainer" id="explainer" hidden aria-labelledby="exTitle">
    <div class="ex-grid">
      <div class="ex-left">
        <div class="ex-head">
          <p class="eyebrow" data-ui="page.title">How life works</p>
          <h1 id="exTitle" tabindex="-1"></h1>
          <p class="summary" id="exSummary"></p>
        </div>
        <figure class="stage" id="stage">
          <canvas id="cv" role="img"></canvas>
          <span class="badge" id="badge" data-ui="badge.illustrative">Illustrative, not to scale</span>
          <p class="nocanvas" id="nocanvas" hidden data-ui="nocanvas"></p>
        </figure>
        <div class="controls" id="controls" role="group" aria-labelledby="ctlLabel">
          <span class="sr-only" id="ctlLabel" data-ui="ctl.timeline">Timeline</span>
          <div class="ctl-row">
            <button class="cbtn" id="prev" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg><span class="cbtn-t" data-ui="ctl.prev">Previous step</span></button>
            <button class="cbtn play" id="play" type="button"><svg viewBox="0 0 20 20" aria-hidden="true" class="ic-play"><path d="M6 4v12l10-6z"/></svg><svg viewBox="0 0 20 20" aria-hidden="true" class="ic-pause"><path d="M6 4h3v12H6zM11 4h3v12h-3z"/></svg><span id="playTxt">Play</span></button>
            <button class="cbtn" id="next" type="button"><span class="cbtn-t" data-ui="ctl.next">Next step</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4 6 6-6 6"/></svg></button>
            <span class="pos" id="pos" aria-hidden="true"></span>
          </div>
          <div class="tl">
            <input type="range" id="timeline" min="0" max="1000" step="1" value="0" aria-label="Timeline" data-ui-label="ctl.timeline">
            <div class="markers" id="markers" role="group" data-ui-label="ctl.markers"></div>
          </div>
          <p class="keys small" data-ui="keys.help"></p>
          <p class="reduced small" id="reducedNote" hidden data-ui="reduced"></p>
        </div>
        <section class="card legend" aria-labelledby="legendTitle">
          <h2 id="legendTitle" data-ui="legend.title">Colour key</h2>
          <ul class="legend-list" id="legend"></ul>
        </section>
      </div>

      <div class="ex-right">
        <section class="card stepcard" id="stepCard" aria-live="polite" aria-atomic="true">
          <p class="steppos" id="stepPos"></p>
          <h2 class="steptitle" id="stepTitle"></h2>
          <p class="steptext" id="stepText"></p>
          <div class="steplinks" id="stepLinks"></div>
        </section>
        <section class="card extra" id="extra" hidden></section>
        <section class="card" aria-labelledby="stepsTitle" id="steps" tabindex="-1">
          <h2 id="stepsTitle" data-ui="steps.title">All steps as text</h2>
          <ol class="steplist" id="stepList"></ol>
        </section>
        <details class="card">
          <summary data-ui="alt.title">Text description of the animation</summary>
          <p id="alt"></p>
        </details>
        <section class="card" aria-labelledby="srcTitle">
          <h2 id="srcTitle" data-ui="sources.title">Sources</h2>
          <ol class="sources" id="sourceList"></ol>
        </section>
      </div>
    </div>
  </section>

  <p class="loadfail wrap" id="loadFail" hidden role="alert"></p>
</main>
<footer class="foot wrap"><p data-ui="foot.credits"></p><p data-ui="foot.status"></p></footer>
<script type="module" src="processes.js"></script>
<script type="module" src="../shell/shell.js" data-page="processes"></script>
</body>
</html>
