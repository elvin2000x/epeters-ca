<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heat vs the Bonds of Life: Cell and Molecule Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="One temperature slider shows why life lives in a narrow band: compare the energy of heat with real bond energies, and watch DNA melt, an egg white protein unfold and water turn to ice and steam.">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b7469'/%3E%3Cpath d='M16 7v12' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='4' fill='%23ff7a2f'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('cme-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* no storage: follow the system theme */ }</script>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="heat.css">
</head>
<body>
<a class="skip" href="#heat">Skip to the temperature slider</a>
<main id="heat" tabindex="-1">
  <p class="ht-loading" id="htLoading">Loading</p>
</main>
<noscript><p class="ht-wrap">This page needs JavaScript to run the slider. In words: the energy of heat at body temperature, RT, is about 2.6 kJ/mol. A C-C covalent bond takes 345 kJ/mol to break, over 100 times more, so heat cannot break it. Hydrogen bonds take about 8 to 29 kJ/mol, only a few times RT, so heat breaks them easily: egg white protein unfolds near 80 °C, DNA strands separate between about 86 and 97 °C, and water boils at 100 °C.</p></noscript>
<script type="module">
import { mount } from './heat.js';
const q = new URLSearchParams(location.search);
const theme = q.get('theme');
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
const main = document.getElementById('heat');
mount(main, { noGL: q.get('nogl') === '1' }).then((api) => {
  const t = parseFloat(q.get('t'));
  if (!Number.isNaN(t)) api.setTemperature(t);
}).catch(() => {
  main.replaceChildren(Object.assign(document.createElement('p'), { className: 'ht-wrap', textContent: 'The page data could not be loaded. Please reload.' }));
});
</script>
<script type="module" src="../shell/shell.js" data-page="heat"></script>
</body>
</html>
