<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Size Lineup: Cell and Molecule Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every molecule in the explorer standing side by side at true scale, from a water molecule to a virus shell, each drawn from its real structure file.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308111d'/%3E%3Ccircle cx='6' cy='25' r='1.5' fill='%23ff0d0d'/%3E%3Ccircle cx='12' cy='23' r='3.5' fill='%23909090'/%3E%3Ccircle cx='22' cy='17' r='8' fill='%233050f8'/%3E%3Cpath d='M3 27h26' stroke='%23a9bccb' stroke-width='1.5'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('cme-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
:root { --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #08111d; color: #e8f1f7; font-family: var(--font-ui); overflow: hidden; }
html[data-theme="light"] body { background: #eef2f6; color: #0f1c28; }
@media (prefers-color-scheme: light) { html:not([data-theme="dark"]) body { background: #eef2f6; color: #0f1c28; } }
#lineup { position: fixed; inset: 0; }
body.cme-shell #lineup { top: calc(var(--cme-bar-h, 52px) + var(--cme-top, 0px)); bottom: var(--cme-dock-h, 0px); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
noscript p { padding: 24px 16px; max-width: 60ch; }
</style>
</head>
<body>
<h1 class="sr-only">Size lineup: every molecule side by side at true scale</h1>
<main id="lineup" aria-label="Size lineup"></main>
<noscript><p>This page needs JavaScript to draw the lineup. In words: 40 molecules stand side by side at the same scale, from water, about 0.16 nanometres across, to a virus shell, about 20 nanometres across, roughly 120 times as wide.</p></noscript>
<script type="module">
import { mount } from './lineup.js';
const q = new URLSearchParams(location.search);
const theme = q.get('theme');
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
mount(document.getElementById('lineup'), {
  moleculesHref: '../molecules/',
  start: q.get('m') || undefined,
});
</script>
<script type="module" src="../shell/shell.js" data-page="lineup"></script>
</body>
</html>
