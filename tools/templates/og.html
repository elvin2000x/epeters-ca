<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=EB+Garamond:wght@500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0A1524;color:#E9EFF7;font:400 24px/1.4 Inter,sans-serif;position:relative;padding:64px 72px;display:flex;flex-direction:column}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(45% 60% at 15% 25%,rgba(224,189,107,.22),transparent 70%),radial-gradient(40% 55% at 90% 15%,rgba(94,140,255,.20),transparent 70%);z-index:-1}
.kick{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font:600 17px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#E0BD6B;background:rgba(224,189,107,.10);border:1.5px solid rgba(224,189,107,.30);padding:12px 18px;border-radius:999px}
.kick i{width:9px;height:9px;border-radius:50%;background:#E0BD6B}
h1{margin-top:34px;font:500 64px/1.08 'EB Garamond',serif;letter-spacing:-.01em;color:#F4EAD0;max-width:1000px;text-wrap:balance}
.row{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
.big{font:600 58px/1 'EB Garamond',serif;color:#E0BD6B;white-space:nowrap}
.big span{display:block;margin-top:10px;font:400 20px/1.3 Inter,sans-serif;color:#B7C6D9;white-space:normal;max-width:560px}
body.nobig .big{display:none}
.by{margin-left:auto;display:flex;align-items:center;gap:14px;font:600 20px/1.2 Inter,sans-serif;color:#E9EFF7;text-align:right}
.by small{display:block;font-weight:400;color:#8BA2BD;margin-top:4px}
.by img{width:64px;height:64px;border-radius:50%;border:2px solid #E0BD6B}
</style></head>
<body class="{{mode}}">
<div class="kick"><i></i>{{eyebrow}}</div>
<h1>{{title}}</h1>
<div class="row">
  <div class="big">{{big}}<span>{{big_label}}</span></div>
  <div class="by"><div>Elvin Peters<small>epeters.ca</small></div><img src="{{headshot}}" alt=""></div>
</div>
</body></html>
